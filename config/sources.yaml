# SOURCE REGISTRY
# Single source of truth for what may be fetched, how, and how fresh it must be.
# `allow_automation: false` is ABSOLUTE — the agent must emit MANUAL_CHECK instead.
# `verified: false` means the URL/behaviour was not confirmed by a live fetch; resolve before
# building load-bearing logic on it.

defaults:
  user_agent: "distressed-re-agents/1.0 (+contact: OPS_EMAIL)"
  max_concurrency_per_host: 1
  retry: { max: 3, backoff: exponential, base_seconds: 5 }
  respect_robots_txt: true

# ─────────────────────────────────────────────────────────────────────────────
# RED LIST — never fetch programmatically. MANUAL_CHECK only.
# ─────────────────────────────────────────────────────────────────────────────
blocked:
  - id: auction_com
    url: https://www.auction.com/
    reason: "ToU bans robots/scrapers and robots.txt circumvention; one ID = one account, ID-verified"
    manual_use: "Largest CA trustee-sale venue (LA/SF). Human checks listings + uses native Max Bid."
  - id: nationwide_posting
    url: https://search.nationwideposting.com/SearchTerms.aspx
    reason: "Verbatim ban on scripting; violators permanently restricted"
  - id: mdc_realforeclose
    url: https://www.miamidade.realforeclose.com/
    reason: "robots.txt disallows auction paths; identity-bound registration; ACH-tied deposits"
    manual_use: "MDC judicial foreclosure calendar + bidding"
  - id: mdc_realtaxdeed
    url: https://www.miamidade.realtaxdeed.com/
    reason: "robots.txt disallow"
    open_question: "Clerk's current Property Tax Deeds page directs registration to the realforeclose host while AO-2013-05 specifies realtaxdeed. RESOLVE LIVE."
  - id: mdc_realtdm
    url: https://miamidade.realtdm.com/public/cases/List
    reason: "robots.txt disallow"
  - id: lienhub
    url: https://lienhub.com/
    reason: "403 to non-browser clients; bot protection"
    sanctioned_alternative: "LienHub batch bid-file (CSV) upload for large investors"
  - id: zillow
    reason: "ToS bans scraping; no usable official API"
  - id: redfin
    reason: "ToS bans scraping"
  - id: priority_posting
    url: https://www.priorityposting.com/
    reason: "robots-disallowed"
  - id: google_imagery_as_cv_input
    reason: "Maps Platform ToS 3.2.3(c)(v) — building an index from Street View imagery is a named prohibited example. 3.2.3(c)(vii) also bans using Maps Content to train or fine-tune ML models. 30-day cache cap."
    allowed_narrow_use: "Street View METADATA endpoint (free, quota-free) as a staleness check only; human eyeballing in review UI"
  - id: google_solar_api
    reason: "Service-Specific Terms 18.1 — permitted use limited to energy-system feasibility/design/installation"

# ─────────────────────────────────────────────────────────────────────────────
# SOURCE REGISTRY
# NOTE: a few entries below carry `allow_automation: false` — they are listed here to DOCUMENT
# a known gap (e.g. the LA County recorder has no online index at all), not as green-list items.
# Always branch on the per-entry `allow_automation` flag; never treat membership in `sources:`
# as permission.
# ─────────────────────────────────────────────────────────────────────────────
sources:

  # ---------- CROSS-MARKET ----------
  - id: courtlistener_v4
    name: CourtListener REST API v4 (RECAP)
    url: https://www.courtlistener.com/api/rest/v4/
    access: api
    auth: "Authorization: Token <CL_TOKEN>"
    allow_automation: true
    verified: true
    freshness_sla_hours: 24
    rate_limit: { free_tier: "5/min, 50/hr, 125/day", recap_fetch: "30/min" }
    notes: >
      Only fully sanctioned API-first auction surface in the system. Courts: cacb, canb, flsb, flmb.
      Match docket entries on "363", "Motion to Sell", "Notice of Sale", "Sale Free and Clear",
      "Bidding Procedures", "Stalking Horse". RECAP Fetch requires YOUR OWN PACER credentials
      (password rotates every 180 days; MFA unsupported) and you still pay PACER fees.
      Since 2026-05-07 fuller API access is bundled into FLP membership.
    channels: [bankruptcy_363]

  - id: ca_ag_2924m_registry
    name: CA AG residential foreclosure sales registry (§2924m)
    url: https://oag.ca.gov/residential-foreclosure-sales
    access: html_paginated
    allow_automation: true
    verified: true
    freshness_sla_hours: 168
    notes: >
      POST-SALE data: county, city, zip, address, trustee sale date, date deemed final,
      WINNING BIDDER, grantees, APN, bidder category A–H. Not a lead source — this is the
      CALIBRATION SET for the MAO model. No API, no bulk; ~43 pages.

